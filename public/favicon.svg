<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <style>
    .brand-dark { stroke: #001026; }
    .brand-yellow { stroke: #ffb300; }
    @media (prefers-color-scheme: dark) {
      .brand-dark { stroke: #ffffff; }
    }
  </style>
  
  <!-- Superior angular bracket -->
  <path d="M2 16L16 5L30 16" class="brand-dark" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M5 16L16 7.5L27 16" class="brand-yellow" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Inferior angular bracket -->
  <path d="M2 16L16 27L30 16" class="brand-dark" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M5 16L16 24.5L27 16" class="brand-yellow" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Geometric letter L in the center representing 'Lopes' -->
  <path d="M13 11V20H19" class="brand-dark" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
